name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Crear una release es ESCRITURA sobre el repositorio, y por defecto el
# GITHUB_TOKEN es de solo lectura. Sin esto el job "Create GitHub Release" falla
# aunque los builds hayan ido bien y los artefactos esten subidos: fue justo lo
# que paso en v1.90.3, con gcc y clang en verde y sus zips ya arriba.
permissions:
  contents: write

jobs:
  # ============================================================================
  # Build Release Binaries for All Compilers
  # ============================================================================
  build-release:
    name: Release - ${{ matrix.compiler }}
    runs-on: windows-latest
    
    # fail-fast: false -- sin esto, que un compilador falle CANCELA a los otros
    # tres. Es lo que paso en v1.90.2: el paso "Setup Intel oneAPI" fallo y se
    # llevo por delante a gcc, clang y msvc, que aparecieron como "cancelled".
    # Un release parcial es mejor que ninguno, y ademas asi se ve que fallo de
    # verdad y que fue arrastrado.
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, msvc, intel]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-clang
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-doxygen
          python
          zip
    
    - name: Setup MSVC
      if: matrix.compiler == 'msvc'
      uses: microsoft/setup-msbuild@v2
    
    # Accion de terceros, y fallo en v1.90.2. Se deja seguir: si Intel no se
    # puede instalar, el resto de la release sale igual y se ve en los artefactos
    # que falta el zip de intel.
    - name: Setup Intel oneAPI
      if: matrix.compiler == 'intel'
      continue-on-error: true
      uses: rscohn2/setup-oneapi@v0
      with:
        components: |
          icx
          dpcpp
    
    # Historia de este paso, para que no se repita:
    #
    #  1. Llamaba a CUATRO scripts de los que TRES no existen en el repositorio
    #     (scripts/vcvarsall.py, scripts/setvarsall_intel.py,
    #     scripts/build_benchmarks.bash). Fallaba en cada tag; se vio en v1.90.1,
    #     que nunca llego a publicarse.
    #  2. Se reescribio con `make.py build uint128 all ...`, y fallo en v1.90.2:
    #     `build` NO acepta `all` como caracteristica, necesita una concreta.
    #     Reproducido en local: "No test file found for feature 'all'".
    #
    # Ahora: `test`, que enumera la suite por su cuenta y ademas la EJECUTA -- de
    # modo que un fallo bloquea la publicacion en vez de empaquetar binarios
    # rotos --, y un bucle explicito para los benchmarks, que se compilan pero no
    # se ejecutan: medir no es cosa de una release.
    #
    # ANTES DE TOCAR ESTE PASO: reproducir el comando en local. Es barato y es
    # lo que no se hizo las dos veces anteriores.
    - name: Build all with ${{ matrix.compiler }}
      if: matrix.compiler == 'gcc' || matrix.compiler == 'clang'
      shell: msys2 {0}
      run: |
        set -e
        python make.py test ${{ matrix.compiler }} release
        for f in benchs/benchmark_*.cpp; do
          name=$(basename "$f" .cpp)
          name=${name#benchmark_}
          echo "--- benchmark: $name"
          python make.py build uint128 "$name" benchs ${{ matrix.compiler }} release
        done
        # `make.py build` DEVUELVE 0 AUNQUE EL ENLAZADO FALLE -- comprobado en
        # local con benchmark_vs_builtin, que necesita GMP y no enlaza sin ella:
        # imprime "Build complete" y sale con 0. Asi que el bucle de arriba no
        # sirve de puerta. Se listan los binarios que han salido de verdad para
        # que la ausencia de alguno se vea en el log en vez de pasar callada.
        echo "=== binarios de benchmark generados ==="
        ls -1 build/build_benchs/${{ matrix.compiler }}/release/ || true
        echo "=== esperados: $(ls -1 benchs/benchmark_*.cpp | wc -l) ==="

    # MSVC no puede construirse desde el shell de MSYS2: `setup-msbuild` trae
    # MSBuild pero NO el entorno de C++, y `cl.exe` no esta en el PATH. Fallo asi
    # en v1.90.3. Es el mismo problema que el CI ya resolvio en T7.1, y se copia
    # su receta: localizar Visual Studio con vswhere -- el localizador oficial de
    # Microsoft, en vez de una ruta cableada -- y abortar con un mensaje claro si
    # no aparece.
    - name: Build all with msvc
      if: matrix.compiler == 'msvc'
      shell: cmd
      run: |
        setlocal enabledelayedexpansion
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
        if not defined VSPATH (echo No hay ninguna instalacion de Visual Studio con VC++ & exit /b 1)
        echo Visual Studio en: %VSPATH%
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        where cl.exe || (echo cl.exe no esta en el PATH tras vcvars64 & exit /b 1)
        python make.py test msvc release || exit /b 1
        for %%f in (benchs\benchmark_*.cpp) do (
          set BN=%%~nf
          set BN=!BN:benchmark_=!
          echo --- benchmark: !BN!
          python make.py build uint128 !BN! benchs msvc release
        )

    # Intel ICX necesita su propio setvars.bat, por el mismo motivo que MSVC.
    # `continue-on-error` porque la accion que lo instala es de terceros y ya
    # fallo una vez (v1.90.2): que Intel no salga no debe dejar sin release a los
    # demas.
    - name: Build all with intel
      if: matrix.compiler == 'intel'
      continue-on-error: true
      shell: cmd
      run: |
        setlocal enabledelayedexpansion
        if exist "%ONEAPI_ROOT%\setvars.bat" (call "%ONEAPI_ROOT%\setvars.bat") else (echo setvars.bat no esta en ONEAPI_ROOT=%ONEAPI_ROOT%)
        where icx.exe || (echo icx.exe no esta en el PATH & exit /b 1)
        python make.py test intel release || exit /b 1
        for %%f in (benchs\benchmark_*.cpp) do (
          set BN=%%~nf
          set BN=!BN:benchmark_=!
          echo --- benchmark: !BN!
          python make.py build uint128 !BN! benchs intel release
        )

    # Si el build de este compilador no dejo binarios, no hay nada que
    # empaquetar: se salta en vez de fallar con un `cp` sobre un directorio que
    # no existe.
    - name: Package release - ${{ matrix.compiler }}
      shell: msys2 {0}
      run: |
        if [ ! -d "build/build_tests/${{ matrix.compiler }}/release" ]; then
          echo "sin binarios para ${{ matrix.compiler }}; no se empaqueta"
          exit 0
        fi
        mkdir -p release-package
        
        # Copiar ejecutables. Los benchmarks pueden no estar --  `make.py build`
        # devuelve 0 aunque el enlazado falle, y benchmark_vs_builtin no enlaza
        # sin GMP -- asi que su copia es opcional. Los tests no: si faltan, el
        # paso ya habria salido arriba.
        cp -r build/build_tests/${{ matrix.compiler }}/release release-package/tests
        if [ -d "build/build_benchs/${{ matrix.compiler }}/release" ]; then
          cp -r build/build_benchs/${{ matrix.compiler }}/release release-package/benchmarks
        else
          echo "sin benchmarks para ${{ matrix.compiler }}"
        fi
        
        # Copiar headers
        cp -r include release-package/
        
        # Copiar documentación
        cp README.md release-package/
        cp LICENSE.txt release-package/
        # `documentation/` solo existe tras ejecutar doxygen; en un checkout
        # limpio no esta, y el `cp` fallaba.
        mkdir -p documentation/generated documentation/doxygen/pages
        doxygen Doxyfile > /dev/null 2>&1 || true
        cp -r documentation release-package/
        
        # Crear archivo zip
        cd release-package
        zip -r ../int128-${{ matrix.compiler }}-windows-x64.zip .
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.compiler }}
        path: int128-${{ matrix.compiler }}-windows-x64.zip
        retention-days: 90
        # Sin esto, un compilador que no llego a empaquetar hace fallar la subida
        # y con ella el job entero.
        if-no-files-found: ignore

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    # `always()` para que se publique aunque algun compilador de la matriz haya
    # fallado: se sube lo que si se construyo. Sin esto, un solo compilador roto
    # deja el tag sin release, que es exactamente lo que le paso a v1.90.1.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-artifacts/**/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          Enteros de anchura fija de N x 64 bits para C++20, solo cabeceras.

          ### Uso

          La biblioteca **no hay que compilarla**: basta con anadir `include/`
          a la ruta de inclusion.

          ```cpp
          #include "fixed_width_int_t.hpp"
          using namespace nstd;

          constexpr uint256_fixed_t a{1000000};
          constexpr auto b = a * a;   // constexpr, modular
          static_assert(b / a == a);
          ```

          ```
          g++ -std=c++20 -I include mi_programa.cpp
          ```

          ### Contenido de cada zip

          - `include/` — las 31 cabeceras. Es lo unico que hace falta.
          - `tests/` y `benchmarks/` — binarios ya compilados, por si se quiere
            comprobar la instalacion o medir en la maquina propia.
          - `documentation/` — la referencia generada con Doxygen.

          ### Un zip por compilador

          GCC (MinGW-w64 UCRT64), Clang, MSVC e Intel oneAPI. Los binarios son de
          Windows x64; **las cabeceras son las mismas en todos** y valen para
          cualquier plataforma.

          Si falta el zip de algun compilador, es que su job fallo; el resto de
          la release es valido igualmente.

          ### Requisitos

          C++20. Probada en GCC 13-16, Clang 18-22, MSVC 19.5x e Intel ICX, sobre
          x86-64, x86-32, ARM64, ARM32 y RISC-V 64.

          El detalle de lo que cambia en esta version esta en `CHANGELOG.md`.

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
