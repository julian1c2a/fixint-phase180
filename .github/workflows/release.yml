name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Build Release Binaries for All Compilers
  # ============================================================================
  build-release:
    name: Release - ${{ matrix.compiler }}
    runs-on: windows-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang, msvc, intel]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-clang
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          python
          zip
    
    - name: Setup MSVC
      if: matrix.compiler == 'msvc'
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup Intel oneAPI
      if: matrix.compiler == 'intel'
      uses: rscohn2/setup-oneapi@v0
      with:
        components: |
          icx
          dpcpp
    
    # T7.6 (25 ago 2026): este paso llamaba a CUATRO scripts, de los que TRES
    # NO EXISTEN en el repositorio: scripts/vcvarsall.py,
    # scripts/setvarsall_intel.py y scripts/build_benchmarks.bash. Por eso el
    # workflow fallaba en cada tag; comprobado en v1.90.1, que fallo al
    # publicarse. Ahora usa make.py, la capa canonica, que resuelve el entorno
    # de MSVC y de Intel por su cuenta (scripts/env_setup/compiler_env.py).
    - name: Build all with ${{ matrix.compiler }}
      shell: msys2 {0}
      run: |
        python make.py build uint128 all tests ${{ matrix.compiler }} release
        python make.py build uint128 all benchs ${{ matrix.compiler }} release

    - name: Package release - ${{ matrix.compiler }}
      shell: msys2 {0}
      run: |
        mkdir -p release-package
        
        # Copiar ejecutables
        cp -r build/build_tests/${{ matrix.compiler }}/release release-package/tests
        cp -r build/build_benchs/${{ matrix.compiler }}/release release-package/benchmarks
        
        # Copiar headers
        cp -r include release-package/
        
        # Copiar documentación
        cp README.md release-package/
        cp LICENSE.txt release-package/
        # `documentation/` solo existe tras ejecutar doxygen; en un checkout
        # limpio no esta, y el `cp` fallaba.
        mkdir -p documentation/generated documentation/doxygen/pages
        doxygen Doxyfile > /dev/null 2>&1 || true
        cp -r documentation release-package/
        
        # Crear archivo zip
        cd release-package
        zip -r ../int128-${{ matrix.compiler }}-windows-x64.zip .
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.compiler }}
        path: int128-${{ matrix.compiler }}-windows-x64.zip
        retention-days: 90

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-artifacts/**/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 🚀 int128 Release
          
          Biblioteca C++20 de enteros de 128 bits (uint128_t + int128_t)
          
          ### 📦 Binarios Incluidos
          - **GCC** - MinGW-w64 UCRT64
          - **Clang** - LLVM/Clang
          - **MSVC** - Microsoft Visual C++
          - **Intel** - Intel oneAPI C++ Compiler
          
          ### 📚 Contenido
          - Tests compilados
          - Benchmarks
          - Headers (`include/`)
          - Documentación completa
          
          ### 🔧 Uso
          1. Descargar el archivo para tu compilador
          2. Extraer el contenido
          3. Incluir headers: `#include "include/int128.hpp"`
          4. Ejecutar tests o benchmarks desde las carpetas correspondientes
          
          ---
          **Compiladores usados:**
          - GCC 11+ / Clang 13+ / MSVC 19.50+ / Intel oneAPI 2025+
          - C++20 o superior requerido
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
