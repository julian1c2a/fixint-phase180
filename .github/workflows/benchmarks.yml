name: Benchmarks - Full Suite

on:
  schedule:
    # Run weekly (Sundays 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Compiler family to benchmark'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gcc
          - clang

env:
  CXXSTD: "-std=c++20"
  INCLUDE: "-Iinclude"

jobs:
  # ============================================================================
  # Benchmark suite — native Linux (GCC + Clang, x86_64)
  # ============================================================================
  benchmark-linux:
    name: "Benchmark — ${{ matrix.compiler }} (${{ matrix.mode }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cxx: g++-14
            pkg: g++-14
            family: gcc
            mode: release-O3
          - compiler: clang-19
            cxx: clang++-19
            pkg: clang-19
            family: clang
            mode: release-O3

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test 2>/dev/null || true
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null 2>&1 || true
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.pkg }}

      - name: Run benchmarks
        env:
          GCC_CXX: ${{ matrix.cxx }}
          CLANG_CXX: ${{ matrix.cxx }}
        run: python3 make.py bench ${{ matrix.family }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.compiler }}-${{ matrix.mode }}
          path: build/build_benchs/
          retention-days: 90

  # ============================================================================
  # Summary
  # ============================================================================
  benchmark-summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: benchmark-linux
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## int128 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler | Mode | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| GCC 14   | O3   | ${{ needs.benchmark-linux.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clang 19 | O3   | ${{ needs.benchmark-linux.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
