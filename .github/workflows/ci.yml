name: CI - Multi-Arch Build & Test (Phase 1.75)

on:
  push:
    branches: [ main, develop, phase-* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CXXSTD: "-std=c++20"
  INCLUDE: "-Iinclude"

jobs:
  # ============================================================================
  # Native x86_64 — GCC + Clang (Linux)
  # ============================================================================
  native-linux:
    name: "${{ matrix.compiler }} — x86_64 (${{ matrix.mode }})"
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC: full range 13–16
          - { compiler: gcc-13,  cxx: g++-13,      pkg: g++-13,     family: gcc,   mode: release-O2 }
          - { compiler: gcc-14,  cxx: g++-14,      pkg: g++-14,     family: gcc,   mode: release-O2 }
          - { compiler: gcc-15,  cxx: g++-15,      pkg: g++-15,     family: gcc,   mode: release-O2 }
          - { compiler: gcc-16,  cxx: g++-16,      pkg: g++-16,     family: gcc,   mode: release-O2, experimental: true }
          # Clang: full range 18–22
          - { compiler: clang-18, cxx: clang++-18, pkg: clang-18,   family: clang, mode: release-O2 }
          - { compiler: clang-19, cxx: clang++-19, pkg: clang-19,   family: clang, mode: release-O2 }
          - { compiler: clang-20, cxx: clang++-20, pkg: clang-20,   family: clang, mode: release-O2 }
          - { compiler: clang-21, cxx: clang++-21, pkg: clang-21,   family: clang, mode: release-O2 }
          - { compiler: clang-22, cxx: clang++-22, pkg: clang-22,   family: clang, mode: release-O2, experimental: true }
          # Debug build on a stable mid-range compiler
          - { compiler: gcc-14,  cxx: g++-14,      pkg: g++-14,     family: gcc,   mode: debug }

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test 2>/dev/null || true
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null 2>&1 || true
          for v in 18 19 20 21 22; do
            sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$v main" 2>/dev/null || true
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.pkg }}

      - name: Build & Test all
        env:
          GCC_CXX: ${{ matrix.cxx }}
          CLANG_CXX: ${{ matrix.cxx }}
        run: python3 make.py test ${{ matrix.family }} ${{ matrix.mode }}

  # ============================================================================
  # Native ARM64 — GCC + Clang (real hardware, ubuntu-24.04-arm)
  # Free on public repos; needs no cross-toolchain or QEMU.
  # ============================================================================
  native-arm64:
    name: "${{ matrix.compiler }} — ARM64 native (${{ matrix.mode }})"
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cxx: g++-14
            pkg: g++-14
            family: gcc
            mode: release-O2
          - compiler: clang-19
            cxx: clang++-19
            pkg: clang-19
            family: clang
            mode: release-O2

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test 2>/dev/null || true
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null 2>&1 || true
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.pkg }}

      - name: Build & Test all
        env:
          GCC_CXX: ${{ matrix.cxx }}
          CLANG_CXX: ${{ matrix.cxx }}
        run: python3 make.py test ${{ matrix.family }} ${{ matrix.mode }}

  # ============================================================================
  # Native x86_64 — MSVC (Windows)
  # ============================================================================
  native-windows:
    name: "MSVC — x86_64 (${{ matrix.mode }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release-O2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      # T7.1 (24 ago 2026): aqui se hacia `call` a una ruta cableada de
      # VS 2022 Enterprise. Si esa ruta no existe, cmd imprime un error y
      # SIGUE, asi que el build continuaba sin entorno de MSVC y fallaban los
      # 55 tests. Ahora se localiza con vswhere (el localizador oficial de
      # Microsoft) y se aborta con un mensaje claro si no aparece.
      - name: Localizar Visual Studio y compilar
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          if not defined VSPATH (echo No hay ninguna instalacion de Visual Studio con VC++ & exit /b 1)
          echo Visual Studio en: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          where cl.exe || (echo cl.exe no esta en el PATH tras vcvars64 & exit /b 1)
          python make.py test msvc ${{ matrix.mode }}

  # ============================================================================
  # Cross-compile: ARM64 (aarch64) — compile + test via QEMU
  # ============================================================================
  cross-arm64:
    name: "cross GCC — aarch64"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-toolchain + QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user

      - name: Cross-compile all tests
        run: |
          CXX=aarch64-linux-gnu-g++
          echo "=== Cross-compiling for aarch64 with $CXX ==="
          $CXX --version
          mkdir -p build_temp
          PASS=0; FAIL=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if $CXX $CXXSTD $INCLUDE -O2 -o "build_temp/${name}_aarch64" "$src" 2>/dev/null; then
              echo "OK"
              PASS=$((PASS + 1))
            else
              echo "FAIL (compile)"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== COMPILE SUMMARY: $PASS/$TOTAL passed, $FAIL failed ==="
          if [ $FAIL -gt $((TOTAL / 10 + 1)) ]; then
            echo "Too many compile failures"; exit 1
          fi

      - name: Run tests under QEMU aarch64
        run: |
          echo "=== Running aarch64 tests under QEMU user-mode ==="
          PASS=0; FAIL=0; TOTAL=0
          for bin in build_temp/*_aarch64; do
            [ -x "$bin" ] || continue
            name=$(basename "$bin")
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if timeout 120 qemu-aarch64 -L /usr/aarch64-linux-gnu "$bin" >/dev/null 2>&1; then
              echo "OK"; PASS=$((PASS + 1))
            else
              echo "FAIL (runtime)"; FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== TEST SUMMARY (aarch64/QEMU): $PASS/$TOTAL passed, $FAIL failed ==="
          if [ $FAIL -gt $((TOTAL / 10 + 1)) ]; then exit 1; fi

  # ============================================================================
  # Cross-compile: ARM32 (armhf) — compile + test via QEMU
  # ============================================================================
  cross-arm32:
    name: "cross GCC — arm32 (armhf)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-toolchain + QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-arm-linux-gnueabihf qemu-user

      - name: Cross-compile all tests
        run: |
          CXX=arm-linux-gnueabihf-g++
          echo "=== Cross-compiling for arm32 (armhf) with $CXX ==="
          $CXX --version
          mkdir -p build_temp
          PASS=0; FAIL=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if $CXX $CXXSTD $INCLUDE -O2 -o "build_temp/${name}_arm32" "$src" 2>build_temp/${name}_arm32.err; then
              echo "OK"; PASS=$((PASS + 1))
            else
              echo "FAIL (compile)"; FAIL=$((FAIL + 1))
              tail -5 "build_temp/${name}_arm32.err"
            fi
          done
          echo ""
          echo "=== COMPILE SUMMARY (arm32): $PASS/$TOTAL passed, $FAIL failed ==="

      - name: Run tests under QEMU arm32
        run: |
          echo "=== Running arm32 tests under QEMU user-mode ==="
          PASS=0; FAIL=0; TOTAL=0
          for bin in build_temp/*_arm32; do
            [ -x "$bin" ] || continue
            name=$(basename "$bin")
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if timeout 180 qemu-arm -L /usr/arm-linux-gnueabihf "$bin" >/dev/null 2>&1; then
              echo "OK"; PASS=$((PASS + 1))
            else
              echo "FAIL (runtime)"; FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== TEST SUMMARY (arm32/QEMU): $PASS/$TOTAL passed, $FAIL failed ==="
        continue-on-error: true

  # ============================================================================
  # Cross-compile: RISC-V 64 — compile + test via QEMU
  # ============================================================================
  cross-riscv64:
    name: "cross GCC — riscv64"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-toolchain + QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-riscv64-linux-gnu qemu-user

      - name: Cross-compile all tests
        run: |
          CXX=riscv64-linux-gnu-g++
          echo "=== Cross-compiling for riscv64 with $CXX ==="
          $CXX --version
          mkdir -p build_temp
          PASS=0; FAIL=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if $CXX $CXXSTD $INCLUDE -O2 -o "build_temp/${name}_riscv64" "$src" 2>/dev/null; then
              echo "OK"; PASS=$((PASS + 1))
            else
              echo "FAIL (compile)"; FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== COMPILE SUMMARY (riscv64): $PASS/$TOTAL passed, $FAIL failed ==="
          if [ $FAIL -gt $((TOTAL / 10 + 1)) ]; then exit 1; fi

      - name: Run tests under QEMU riscv64
        run: |
          echo "=== Running riscv64 tests under QEMU user-mode ==="
          PASS=0; FAIL=0; TOTAL=0
          for bin in build_temp/*_riscv64; do
            [ -x "$bin" ] || continue
            name=$(basename "$bin")
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if timeout 120 qemu-riscv64 -L /usr/riscv64-linux-gnu "$bin" >/dev/null 2>&1; then
              echo "OK"; PASS=$((PASS + 1))
            else
              echo "FAIL (runtime)"; FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== TEST SUMMARY (riscv64/QEMU): $PASS/$TOTAL passed, $FAIL failed ==="
          if [ $FAIL -gt $((TOTAL / 10 + 1)) ]; then exit 1; fi

  # ============================================================================
  # Cross-compile: x86 32-bit (i686) — compile + test natively (multilib)
  # ============================================================================
  cross-x86-32:
    name: "GCC — x86 32-bit (i686)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit multilib
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-multilib libc6-dev-i386

      - name: Compile & test with -m32
        run: |
          echo "=== Compiling for x86 32-bit (i686) ==="
          g++ --version
          mkdir -p build_temp
          PASS_C=0; FAIL_C=0; PASS_R=0; FAIL_R=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if g++ -m32 $CXXSTD $INCLUDE -O2 -o "build_temp/${name}_i686" "$src" 2>build_temp/${name}_i686.err; then
              PASS_C=$((PASS_C + 1))
              if timeout 60 "./build_temp/${name}_i686" >/dev/null 2>&1; then
                echo "OK (compile + run)"; PASS_R=$((PASS_R + 1))
              else
                echo "OK (compile) / FAIL (run)"; FAIL_R=$((FAIL_R + 1))
              fi
            else
              echo "FAIL (compile)"; FAIL_C=$((FAIL_C + 1))
              tail -5 "build_temp/${name}_i686.err"
            fi
          done
          echo ""
          echo "=== SUMMARY (x86 32-bit) ==="
          echo "  Compile: $PASS_C/$TOTAL passed"
          echo "  Runtime: $PASS_R/$PASS_C passed"

  # ============================================================================
  # Sanitizers — ASan + UBSan (Clang, x86_64)
  # ============================================================================
  sanitizers:
    name: "Sanitizers (ASan+UBSan) — Clang 19"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19

      - name: Build & run with ASan + UBSan
        run: |
          CXX=clang++-19
          FLAGS="-std=c++20 -Iinclude -g -fsanitize=address,undefined -fno-omit-frame-pointer -fconstexpr-steps=100000000"
          echo "=== Sanitizer build with $CXX ==="
          mkdir -p build_temp
          PASS=0; FAIL=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if $CXX $FLAGS -o "build_temp/${name}_san" "$src" 2>/dev/null; then
              export ASAN_OPTIONS=detect_leaks=1
              export UBSAN_OPTIONS=print_stacktrace=1
              # 120 s no daba ni de lejos: bajo ASan+UBSan los sweep tests
              # tardan minutos (test_sweep_string, 6m17s medido en WSL). El job
              # llevaba meses en rojo por esto, no por ningun hallazgo del
              # sanitizer.
              if timeout 900 "./build_temp/${name}_san" >/dev/null 2>&1; then
                echo "OK"; PASS=$((PASS + 1))
              else
                echo "FAIL (sanitizer)"; FAIL=$((FAIL + 1))
              fi
            else
              echo "FAIL (compile)"; FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== SANITIZER SUMMARY: $PASS/$TOTAL clean ==="
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ============================================================================
  # Compilacion con Clang SIN flags no estandar  (T7.3)
  #
  # La biblioteca tiene que compilar con `clang++ -std=c++20 -I include` y nada
  # mas. Durante meses NO fue asi: la inicializacion de GM_TABLE gastaba unos 2
  # millones de pasos constexpr, el doble del limite por defecto de Clang, y
  # hacia falta -fconstexpr-steps=100000000. El flag lo inyectaban los scripts
  # del proyecto, asi que el problema solo se veia al incluir los headers desde
  # fuera. Este job existe para que no vuelva a colarse.
  # ============================================================================
  clang-no-flags:
    name: "Clang sin flags extra (consumidor externo)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19

      - name: Cada header, aislado y sin flags extra
        run: |
          echo "=== Un TU por header, solo -std=c++20 -I include ==="
          FAIL=0; TOTAL=0
          mkdir -p build_temp
          for hdr in $(find include -name '*.hpp' | sort); do
            rel="${hdr#include/}"
            name=$(echo "$rel" | tr '/' '_')
            TOTAL=$((TOTAL + 1))
            printf '  %-52s ' "$rel"
            printf '#include "%s"\n#include "%s"\n' "$rel" "$rel" > "build_temp/${name}.cpp"
            if clang++-19 -std=c++20 -I include -fsyntax-only "build_temp/${name}.cpp" 2>"build_temp/${name}.err"; then
              echo OK
            else
              echo FAIL
              grep -m3 'error:' "build_temp/${name}.err" || true
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== $((TOTAL - FAIL))/$TOTAL headers compilan sin flags extra ==="
          if [ $FAIL -gt 0 ]; then
            echo "Algun header necesita flags no estandar. Ver T7.3 en NEXT_STEPS.md."
            exit 1
          fi

      - name: La suite, sin flags extra
        run: |
          FAIL=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            printf '  %-40s ' "$name"
            if clang++-19 -std=c++20 -O2 -I include -o "build_temp/$name" "$src" 2>"build_temp/${name}.err"; then
              echo OK
            else
              echo FAIL
              grep -m3 'error:' "build_temp/${name}.err" || true
              FAIL=$((FAIL + 1))
            fi
          done
          echo "=== $((TOTAL - FAIL))/$TOTAL tests compilan sin flags extra ==="
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ============================================================================
  # Formato y coherencia de la documentacion  (T1.4, T6.5)
  # ============================================================================
  format-and-docs:
    name: "clang-format + armonizador de documentacion"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # OJO CON LA VERSION. clang-format no es estable entre versiones mayores:
      # la v19 rompe `a ^ T{0}` en `a ^ T { 0 }` (lee `^ T{` como declaracion), y
      # el artefacto `R{a} ^ R { b }` que aparecio en el arbol al empezar la
      # auditoria venia justamente de ella.
      #
      # Medido el 25 ago 2026 sobre los 103 ficheros del arbol, la v21.1.8 y la
      # v22.1.8 lo dejan las DOS tal cual: es punto fijo de ambas. En local se
      # usa la 22.1.8, que es la que trae MSYS2; aqui se comprueba con la 21,
      # que es la que hay en apt.llvm.org para noble.
      #
      # Que sean distintas es deliberado: da una segunda opinion gratis. Si
      # alguna vez discrepan sobre una construccion nueva, este job se pone en
      # rojo y esa construccion se escribe de forma que valga para las dos.
      - name: Install clang-format 21 y doxygen
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-21 doxygen

      - name: El arbol respeta .clang-format
        run: |
          FAIL=0
          for f in $(find include tests benchs demos -name '*.hpp' -o -name '*.cpp' | sort); do
            if ! clang-format-21 --dry-run --Werror "$f" 2>/dev/null; then
              echo "  sin formatear: $f"
              FAIL=$((FAIL + 1))
            fi
          done
          if [ $FAIL -gt 0 ]; then
            echo "$FAIL ficheros no respetan .clang-format (clang-format 21)."
            echo "Ejecuta: clang-format-21 -i <fichero>. Ver la nota de version mas arriba."
            exit 1
          fi
          echo "Todo el arbol respeta .clang-format"

      - name: Headers autocontenidos
        run: python3 scripts/check_headers_selfcontained.py --compiler gcc

      - name: Coherencia de la documentacion
        run: python3 scripts/check_docs_consistency.py --doxygen

  # ============================================================================
  # Static Analysis — cppcheck (include/ headers)
  # continue-on-error: findings shown in dashboard but don't block CI
  # ============================================================================
  static-cppcheck:
    name: "cppcheck — include/"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=noExplicitConstructor \
            -I include \
            include/ 2>&1 | tee cppcheck-report.txt
          echo "=== cppcheck done ==="

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
          retention-days: 30

  # ============================================================================
  # Static Analysis — clang-tidy (headers via test_param_* compilation drivers)
  # HeaderFilterRegex limits reports to include/**; continue-on-error for now
  # ============================================================================
  static-clang-tidy:
    name: "clang-tidy — include/ (via test_param_*)"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy-19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy-19

      - name: Run clang-tidy
        run: |
          REPORT=clang-tidy-report.txt
          echo "" > "$REPORT"
          WARN_FILES=0; TOTAL=0
          for src in tests/test_param_*.cpp; do
            name=$(basename "$src")
            TOTAL=$((TOTAL+1))
            echo -n "  [$TOTAL] $name ... "
            if clang-tidy-19 "$src" \
                --header-filter='include/.*' \
                -- -std=c++20 -Iinclude \
                >> "$REPORT" 2>&1; then
              echo "clean"
            else
              echo "warnings — see artifact"
              WARN_FILES=$((WARN_FILES+1))
            fi
          done
          echo ""
          echo "=== clang-tidy: $WARN_FILES/$TOTAL files had warnings ==="

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 30

  # ============================================================================
  # Intel oneAPI — PR only
  # ============================================================================
  intel-build:
    name: "Intel ICX — x86_64 (release)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Intel oneAPI
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | \
            gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | \
            sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq intel-oneapi-compiler-dpcpp-cpp

      - name: Build & Test with Intel
        run: |
          source /opt/intel/oneapi/setvars.sh
          CXX=icpx
          FLAGS="-std=c++20 -Iinclude -O2"
          echo "=== Intel ICX build ==="
          $CXX --version
          mkdir -p build_temp
          PASS=0; FAIL=0; TOTAL=0
          for src in tests/test_*.cpp; do
            name=$(basename "$src" .cpp)
            TOTAL=$((TOTAL + 1))
            echo -n "  [$TOTAL] $name ... "
            if $CXX $FLAGS -o "build_temp/${name}_intel" "$src" 2>/dev/null; then
              if timeout 60 "./build_temp/${name}_intel" >/dev/null 2>&1; then
                echo "OK"; PASS=$((PASS + 1))
              else
                echo "FAIL (runtime)"; FAIL=$((FAIL + 1))
              fi
            else
              echo "FAIL (compile)"; FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== INTEL SUMMARY: $PASS/$TOTAL passed ==="
          # T7.1: mismo caso que x86-32; este job contaba los fallos, los
          # imprimia y salia con 0. Nunca pudo fallar desde que se creo.
          if [ $FAIL -gt 0 ]; then exit 1; fi

  # ============================================================================
  # CI Dashboard Summary
  # ============================================================================
  ci-summary:
    name: CI Dashboard
    runs-on: ubuntu-latest
    needs: [native-linux, native-arm64, native-windows, cross-arm64, cross-arm32, cross-riscv64, cross-x86-32, sanitizers, clang-no-flags, format-and-docs, static-cppcheck, static-clang-tidy]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## int128 Library -- CI Dashboard (Phase 1.75)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Native Platforms" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Compiler | Arch | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | GCC 14/15, Clang 19/20 | x86_64 | ${{ needs.native-linux.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | GCC 14, Clang 19 | ARM64 (native) | ${{ needs.native-arm64.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | MSVC 2022 | x86_64 | ${{ needs.native-windows.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cross-Compilation (GCC + QEMU)" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | Bitness | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| aarch64 (ARM64) | 64-bit | ${{ needs.cross-arm64.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| armhf (ARM32) | 32-bit | ${{ needs.cross-arm32.result == 'success' && 'PASS' || 'WARN' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| riscv64 | 64-bit | ${{ needs.cross-riscv64.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| i686 (x86 32-bit) | 32-bit | ${{ needs.cross-x86-32.result == 'success' && 'PASS' || 'WARN' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ASan + UBSan | ${{ needs.sanitizers.result == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cppcheck | ${{ needs.static-cppcheck.result == 'success' && 'PASS' || 'WARN' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| clang-tidy | ${{ needs.static-clang-tidy.result == 'success' && 'PASS' || 'WARN' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail on critical errors
        if: |
          needs.native-linux.result == 'failure' ||
          needs.native-arm64.result == 'failure' ||
          needs.native-windows.result == 'failure' ||
          needs.cross-arm64.result == 'failure' ||
          needs.cross-arm32.result == 'failure' ||
          needs.cross-riscv64.result == 'failure' ||
          needs.cross-x86-32.result == 'failure' ||
          needs.sanitizers.result == 'failure' ||
          needs.clang-no-flags.result == 'failure' ||
          needs.format-and-docs.result == 'failure'
        run: exit 1
